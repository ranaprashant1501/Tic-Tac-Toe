    <link rel="stylesheet" href="style.css">
</head>
<body>

        Tic-Tac-Toe

    </div>
    
    <div id="container">
        <div id="game">

            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
        </div>

        <button class="button" id="reset">Reset Game</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
